services:
  - type: web
    name: flowboard-api
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci && npm run build -w server
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY # Render's proxy sets X-Forwarded-For; rate limits must see the visitor's IP
        value: "1"
      - key: DATABASE_URL # postgres://user:pass@<unpooled host>/<db>?sslmode=require
        sync: false
      - key: JWT_SECRET # random value generated by Render
        generateValue: true
      - key: GROQ_API_KEY # optional: without it the summary shows the "unavailable" message
        sync: false
      - key: WEB_ORIGIN # the Vercel site URL, for CORS and Socket.io
        sync: false
